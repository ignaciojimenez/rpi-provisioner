# Raspberry Pi Host Presets Configuration
# 
# Define host-specific configurations that can be used with:
#   ./provision_pi <image> <hostname> [options]
#
# If hostname matches a preset, these settings will be applied automatically.
# You can still override any setting with command-line flags.

# Example: ./provision_pi raspbian pihole --github myusername
# This will use the pihole preset below (wired only, no WiFi)

presets:
  pihole:
    description: "Pi-hole DNS server"

  cobra:
    description: "Media server"
    
  hifipi:
    description: "HiFi audio streaming" 
    hardware:
      - type: "hifiberry-dacplus"
        config: |
          # dtoverlay=hifiberry-dacplus
          dtoverlay=hifiberry-dacplushd
          dtparam=audio=off
    
  dockassist:
    description: "Docker/Home Assistant host"
    # ⚠️ Must stay false — defaults.disable_wifi is true, and this host would
    # inherit it. dockassist is wired on the IoT VLAN, but the Thread border
    # router sits on another VLAN and the only path to the Thread mesh (so to
    # every Matter device) is a second IPv6-only Wi-Fi leg onto that VLAN.
    # Ansible builds the leg; this just has to leave the radio switched on.
    # Two door sensors were offline for five days over this, 2026-08-17 to 08-22.
    # NOTE: --no-wifi on the command line still overrides this, by design.
    disable_wifi: false
    
  devpi:
    description: "Development/testing Pi"
    disable_wifi: false
    
  vinylstreamer:
    description: "Vinyl audio streaming"
    disable_wifi: false
    
  unifi:
    description: "UniFi controller"
    

# Default settings (used if no preset matches)
defaults:
  user: "choco"
  timezone: "Europe/Madrid"
  locale: "en_US.UTF-8"
  keymap: "us"
  github: ignaciojimenez
  disable_wifi: true
